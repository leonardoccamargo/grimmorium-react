<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do Grimmorium</title>
  <desc id="description">O frontend React se comunica por REST com a API Flask e SQLite. O frontend tambem consulta a API externa D and D 5e SRD.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38434a"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#f8f4e8"/>
  <text x="600" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#263238">Arquitetura do Grimmorium</text>
  <path d="M372 260 H492" stroke="#38434a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="432" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#38434a">REST: GET, POST, PUT, DELETE</text>
  <path d="M372 330 C520 440, 730 440, 872 330" fill="none" stroke="#38434a" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="622" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#38434a">REST: consulta e tratamento de magias</text>
  <rect x="80" y="185" width="292" height="150" rx="8" fill="#f2d68b" stroke="#8d6e22" stroke-width="3"/>
  <text x="226" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#263238">Frontend React</text>
  <text x="226" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">Grimmorium</text>
  <rect x="492" y="185" width="292" height="150" rx="8" fill="#b9d8cf" stroke="#38675d" stroke-width="3"/>
  <text x="638" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#263238">API Flask</text>
  <text x="638" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263238">SQLite e Swagger</text>
  <rect x="872" y="185" width="250" height="150" rx="8" fill="#d8c9e8" stroke="#6b4b88" stroke-width="3"/>
  <text x="997" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#263238">API Externa</text>
  <text x="997" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#263238">D&amp;D 5e SRD API</text>
  <text x="997" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#263238">dnd5eapi.co</text>
</svg>