services:
  backend:
    build:
      context: ../grimmorium-react-backend
    container_name: grimmorium-backend
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: grimmorium-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
