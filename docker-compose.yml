services:
  backend:
    build:
      context: ../grimmorium-react-backend
    container_name: grimmorium-backend
    environment:
      FRONTEND_PUBLIC_DIR: /frontend-public
    ports:
      - "5000:5000"
    volumes:
      - grimmorium_data:/app/instance
      - ./public:/frontend-public
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: grimmorium-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  grimmorium_data:
